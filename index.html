<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AninCraft — Моды для Minecraft</title>
  <meta
    name="description"
    content="AninCraft готовится к запуску. Площадка для скачивания модов Minecraft откроется в течение недели."
  >
  <meta
    name="keywords"
    content="AninCraft, Minecraft, моды Minecraft, Minecraft mods, сборки Minecraft"
  >

  <meta property="og:title" content="AninCraft — Моды для Minecraft">
  <meta
    property="og:description"
    content="AninCraft готовится к запуску. Площадка для скачивания модов Minecraft откроется в течение недели."
  >
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='36'%3E%E2%9B%8F%EF%B8%8F%3C/text%3E%3C/svg%3E"
  >

  <style>
    :root {
      --bg: #0f0a1a;
      --bg-soft: #150b26;
      --bg-card: rgba(26, 15, 46, 0.82);
      --bg-card-strong: #1a0f2e;

      --accent: #a855f7;
      --accent-2: #8b5cf6;
      --accent-3: #c084fc;
      --accent-dark: #7c3aed;

      --blue-purple: #6366f1;

      --text: #e9e6f2;
      --text-muted: #b8b0cc;
      --text-soft: #9289a8;

      --border: rgba(192, 132, 252, 0.16);
      --border-hover: rgba(192, 132, 252, 0.32);

      --success: #8ce99a;

      --shadow:
        0 20px 60px rgba(0, 0, 0, 0.3);

      --shadow-accent:
        0 15px 50px rgba(124, 58, 237, 0.2);

      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;

      --container: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 58, 237, 0.16), transparent 32%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.12), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(99, 102, 241, 0.09), transparent 35%),
        var(--bg);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.55;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(calc(100% - 32px), var(--container));
      margin: 0 auto;
    }

    .section {
      padding: 90px 0;
    }

    .section-header {
      max-width: 720px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--accent-3);
      background: rgba(124, 58, 237, 0.09);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .section-title {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
      letter-spacing: -0.035em;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .section-description {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* =========================
       HEADER
    ========================== */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(192, 132, 252, 0.1);
      background: rgba(15, 10, 26, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .logo-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent-3));
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.3);
      font-size: 19px;
    }

    .logo-text {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(90deg, #fff, var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .main-nav {
      display: none;
      align-items: center;
      gap: 26px;
    }

    .nav-link {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: #fff;
    }

    .language-switcher {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.025);
    }

    .lang-button {
      border: 0;
      background: transparent;
      color: var(--text-soft);
      border-radius: 7px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .lang-button:hover {
      color: #fff;
      transform: translateY(-1px);
    }

    .lang-button.active {
      color: #fff;
      background: rgba(168, 85, 247, 0.2);
      box-shadow: inset 0 0 0 1px rgba(192, 132, 252, 0.15);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      position: relative;
      min-height: calc(100vh - 74px);
      display: flex;
      align-items: center;
      padding: 90px 0 80px;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(5px);
      pointer-events: none;
    }

    .hero::before {
      width: 500px;
      height: 500px;
      top: -250px;
      left: -200px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.25), transparent 68%);
    }

    .hero::after {
      width: 600px;
      height: 600px;
      right: -300px;
      bottom: -300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.17), transparent 68%);
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr;
      gap: 52px;
      align-items: center;
    }

    .hero-content {
      max-width: 780px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 23px;
      padding: 9px 14px;
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.11);
      color: var(--accent-3);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.1);
    }

    .hero h1 {
      max-width: 880px;
      font-size: clamp(44px, 8vw, 82px);
      line-height: 0.99;
      letter-spacing: -0.06em;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .hero-title-gradient {
      background:
        linear-gradient(
          100deg,
          #ffffff 5%,
          #e9d5ff 34%,
          #c084fc 61%,
          #818cf8 100%
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 760px;
      margin-bottom: 32px;
      color: var(--text-muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      min-height: 49px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 18px;
      border: 1px solid transparent;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      box-shadow: 0 14px 35px rgba(124, 58, 237, 0.28);
    }

    .btn-primary:hover {
      box-shadow: 0 18px 42px rgba(124, 58, 237, 0.38);
    }

    .btn-secondary {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255,255,255,0.025);
    }

    .btn-secondary:hover {
      border-color: var(--border-hover);
      background: rgba(255,255,255,0.045);
    }

    .hero-preview {
      position: relative;
      min-height: 330px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preview-glow {
      position: absolute;
      width: 310px;
      height: 310px;
      background: radial-gradient(
        circle,
        rgba(168, 85, 247, 0.23),
        rgba(124, 58, 237, 0.06) 48%,
        transparent 70%
      );
      filter: blur(4px);
    }

    .preview-card {
      position: relative;
      width: min(100%, 420px);
      min-height: 290px;
      padding: 24px;
      border: 1px solid rgba(192, 132, 252, 0.2);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(168, 85, 247, 0.12), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)),
        rgba(21, 11, 38, 0.78);
      box-shadow:
        var(--shadow),
        0 20px 80px rgba(124, 58, 237, 0.18);
      overflow: hidden;
    }

    .preview-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -60px;
      top: -70px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.12);
      filter: blur(15px);
    }

    .preview-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .preview-dots {
      display: flex;
      gap: 6px;
    }

    .preview-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }

    .preview-status {
      width: 68px;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--blue-purple));
      opacity: 0.72;
    }

    .preview-main-icon {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 25px;
      background:
        linear-gradient(135deg, rgba(124,58,237,0.85), rgba(192,132,252,0.38));
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.28);
      font-size: 47px;
    }

    .preview-line {
      height: 10px;
      margin: 9px auto;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }

    .preview-line.large {
      width: 65%;
      background: linear-gradient(90deg, rgba(192,132,252,0.35), rgba(255,255,255,0.06));
    }

    .preview-line.small {
      width: 42%;
    }

    .preview-pill-row {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 22px;
    }

    .preview-pill {
      width: 53px;
      height: 19px;
      border-radius: 999px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* =========================
       FEATURES
    ========================== */

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .feature-card,
    .benefit-card {
      position: relative;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background:
        linear-gradient(150deg, rgba(168,85,247,0.055), transparent 42%),
        rgba(255,255,255,0.018);
      box-shadow: 0 15px 50px rgba(0,0,0,0.13);
      overflow: hidden;
      transition:
        transform 0.28s ease,
        border-color 0.28s ease,
        box-shadow 0.28s ease;
    }

    .feature-card:hover,
    .benefit-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow:
        var(--shadow-accent),
        0 20px 55px rgba(0,0,0,0.16);
    }

    .feature-icon,
    .benefit-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(
        135deg,
        rgba(124,58,237,0.92),
        rgba(168,85,247,0.55)
      );
      box-shadow: 0 12px 28px rgba(124,58,237,0.17);
    }

    .feature-icon svg,
    .benefit-icon svg {
      width: 25px;
      height: 25px;
    }

    .feature-card h3,
    .benefit-card h3 {
      margin-bottom: 9px;
      font-size: 18px;
      letter-spacing: -0.015em;
    }

    .feature-card p,
    .benefit-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 17px;
    }

    .coming-label {
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid rgba(168,85,247,0.18);
      color: var(--accent-3);
      background: rgba(168,85,247,0.08);
      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       BENEFITS
    ========================== */

    .benefits-section {
      padding-top: 30px;
    }

    .benefit-card {
      min-height: 205px;
    }

    .benefit-icon {
      color: var(--accent-3);
      background: rgba(168,85,247,0.09);
      border: 1px solid rgba(168,85,247,0.17);
      box-shadow: none;
    }

    /* =========================
       COUNTDOWN
    ========================== */

    .launch-box {
      position: relative;
      padding: 32px 22px;
      border: 1px solid rgba(192,132,252,0.19);
      border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 15% 20%, rgba(168,85,247,0.14), transparent 34%),
        radial-gradient(circle at 90% 80%, rgba(99,102,241,0.1), transparent 32%),
        rgba(255,255,255,0.018);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .launch-box::after {
      content: "";
      position: absolute;
      inset: auto 10% -130px 10%;
      height: 180px;
      border-radius: 50%;
      background: rgba(124,58,237,0.15);
      filter: blur(40px);
      pointer-events: none;
    }

    .launch-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .launch-description {
      max-width: 720px;
      margin: 0 auto 32px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 720px;
      margin: 0 auto;
    }

    .time-box {
      padding: 17px 10px;
      border: 1px solid rgba(192,132,252,0.15);
      border-radius: 15px;
      background: rgba(15,10,26,0.4);
    }

    .time-number {
      display: block;
      margin-bottom: 5px;
      font-size: clamp(27px, 6vw, 42px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff, var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       ADS
    ========================== */

    .ad-section {
      padding: 34px 0;
    }

    .ad-container {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px dashed rgba(192,132,252,0.21);
      border-radius: 18px;
      background:
        linear-gradient(140deg, rgba(124,58,237,0.045), rgba(255,255,255,0.012));
      color: var(--text-soft);
    }

    .ad-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .ad-hint {
      max-width: 480px;
      text-align: center;
      font-size: 12px;
      color: rgba(184,176,204,0.55);
    }

    /* =========================
       FAQ
    ========================== */

    .faq-list {
      max-width: 850px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .faq-item {
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255,255,255,0.018);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .faq-item[open] {
      border-color: var(--border-hover);
    }

    .faq-item summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      list-style: none;
      padding: 19px 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .faq-item summary::-webkit-details-marker {
      display: none;
    }

    .faq-item summary::after {
      content: "+";
      flex-shrink: 0;
      color: var(--accent-3);
      font-size: 22px;
      font-weight: 400;
      transition: transform 0.2s ease;
    }

    .faq-item[open] summary::after {
      transform: rotate(45deg);
    }

    .faq-answer {
      padding: 0 20px 20px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.75;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      padding: 55px 0 30px;
      border-top: 1px solid rgba(192,132,252,0.1);
      background: rgba(10, 6, 17, 0.34);
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .footer-brand strong {
      font-size: 18px;
    }

    .footer-brand span {
      color: var(--text-soft);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 17px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .footer-links a {
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #fff;
    }

    .footer-bottom {
      padding-top: 22px;
      border-top: 1px solid rgba(192,132,252,0.08);
      color: var(--text-soft);
      font-size: 12px;
    }

    /* =========================
       REVEAL ANIMATION
    ========================== */

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hero-reveal {
      animation: heroFade 0.8s ease both;
    }

    @keyframes heroFade {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (min-width: 700px) {
      .container {
        width: min(calc(100% - 48px), var(--container));
      }

      .main-nav {
        display: flex;
      }

      .hero {
        padding: 110px 0;
      }

      .hero-grid {
        grid-template-columns: minmax(0, 1.18fr) minmax(320px, 0.82fr);
      }

      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .countdown {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .launch-box {
        padding: 45px 40px;
      }

      .footer-inner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    @media (min-width: 980px) {
      .cards-grid.features {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .cards-grid.benefits {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .feature-card,
      .benefit-card {

    let currentLanguage = "ru";

    function getInitialLanguage() {
      const savedLanguage = localStorage.getItem("lang");

      if (savedLanguage === "ru" || savedLanguage === "en") {
        return savedLanguage;
      }

      const browserLanguage = navigator.language || navigator.userLanguage || "";

      return browserLanguage.toLowerCase().startsWith("ru")
        ? "ru"
        : "en";
    }

    function getTranslation(key) {
      return (
        translations[currentLanguage]?.[key] ??
        translations.en?.[key] ??
        key
      );
    }

    function setLanguage(lang) {
      if (!translations[lang]) {
        lang = "en";
      }

      currentLanguage = lang;

      document.documentElement.lang = lang;

      /*
        Обычные текстовые элементы.
      */
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.getAttribute("data-i18n");
        const value = getTranslation(key);

        element.textContent = value;
      });

      /*
        Placeholder.
      */
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        const key = element.getAttribute("data-i18n-placeholder");
        const value = getTranslation(key);

        element.setAttribute("placeholder", value);
      });

      /*
        aria-label.
      */
      document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
        const key = element.getAttribute("data-i18n-aria-label");
        const value = getTranslation(key);

        element.setAttribute("aria-label", value);
      });

      /*
        title.
      */
      document.querySelectorAll("[data-i18n-title]").forEach((element) => {
        const key = element.getAttribute("data-i18n-title");
        const value = getTranslation(key);

        element.setAttribute("title", value);
      });

      /*
        SEO title.
      */
      document.title = getTranslation("meta.title");

      /*
        SEO description.
      */
      const descriptionTag = document.querySelector('meta[name="description"]');

      if (descriptionTag) {
        descriptionTag.setAttribute(
          "content",
          getTranslation("meta.description")
        );
      }

      /*
        SEO keywords.
      */
      const keywordsTag = document.querySelector('meta[name="keywords"]');

      if (keywordsTag) {
        keywordsTag.setAttribute(
          "content",
          getTranslation("meta.keywords")
        );
      }

      /*
        Open Graph.
      */
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDescription = document.querySelector('meta[property="og:description"]');
      const ogLocale = document.querySelector('meta[property="og:locale"]');

      if (ogTitle) {
        ogTitle.setAttribute("content", getTranslation("meta.title"));
      }

      if (ogDescription) {
        ogDescription.setAttribute(
          "content",
          getTranslation("meta.description")
        );
      }

      if (ogLocale) {
        ogLocale.setAttribute(
          "content",
          lang === "ru" ? "ru_RU" : "en_US"
        );
      }

      /*
        Активная кнопка языка.
      */
      document.querySelectorAll(".lang-button").forEach((button) => {
        const isActive = button.dataset.lang === lang;

        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      /*
        Сохраняем язык.
      */
      localStorage.setItem("lang", lang);

      /*
        Обновляем таймер после переключения языка.
      */
      updateCountdown();
    }

    /*
      ============================================================
      COUNTDOWN
      ============================================================
    */

    /*
      ВАЖНО:
      Пользователь указал 1 сентября 2026 года.
      После наступления этой даты таймер будет показывать нули.

      Для нового запуска просто замени значение TARGET_DATE.
    */
    const TARGET_DATE = new Date("2026-09-01T00:00:00");

    function updateCountdown() {
      const now = new Date();
      const difference = TARGET_DATE.getTime() - now.getTime();

      let days = 0;
      let hours = 0;
      let minutes = 0;
      let seconds = 0;

      if (difference > 0) {
        const totalSeconds = Math.floor(difference / 1000);

        days = Math.floor(totalSeconds / 86400);
        hours = Math.floor((totalSeconds % 86400) / 3600);
        minutes = Math.floor((totalSeconds % 3600) / 60);
        seconds = totalSeconds % 60;
      }

      document.getElementById("days").textContent =
        String(days).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    /*
      ============================================================
      SCROLL REVEAL
      ============================================================
    */

    function initRevealAnimation() {
      const elements = document.querySelectorAll(".reveal");

      if (!("IntersectionObserver" in window)) {
        elements.forEach((element) => {
          element.classList.add("is-visible");
        });

        return;
      }

      const observer = new IntersectionObserver(
        (entries, currentObserver) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              currentObserver.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.12,
          rootMargin: "0px 0px -30px 0px"
        }
      );

      elements.forEach((element) => observer.observe(element));
    }

    /*
      ============================================================
      LANGUAGE BUTTONS
      ============================================================
    */

    document.querySelectorAll(".lang-button").forEach((button) => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    /*
      ============================================================
      INIT
      ============================================================
    */

    document.addEventListener("DOMContentLoaded", () => {
      currentLanguage = getInitialLanguage();

      setLanguage(currentLanguage);

      updateCountdown();

      setInterval(updateCountdown, 1000);

      initRevealAnimation();
    });

    /*
      ============================================================
      БУДУЩИЕ ДОПОЛНЕНИЯ
      ============================================================

      <!-- ДОБАВЬ ПЕРЕВОД ЗДЕСЬ -->

      При добавлении нового текста:
      1. Добавь ключ в translations.ru.
      2. Добавь ТОЧНО ТАКОЙ ЖЕ ключ в translations.en.
      3. В HTML используй data-i18n="твой.ключ".

      Пример:

      ru:
        "new.text": "Новый текст",

      en:
        "new.text": "New text"

      HTML:
        <span data-i18n="new.text"></span>
    */
  </script>

</body>
</html>
